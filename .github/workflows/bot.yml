name: PNARD opportunity bot

on:
  schedule:
    # Every hour at :15 — avoid the top-of-hour cron congestion that
    # GitHub Actions is known for
    - cron: "15 * * * *"
  workflow_dispatch:   # lets you click "Run workflow" manually

# Permissions needed to commit seen.json back to the repo
permissions:
  contents: write

concurrency:
  # Don't let two runs stomp on each other if one takes >1h
  group: pnard-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py

      - name: Commit seen.json
        run: |
          if [[ -n "$(git status --porcelain seen.json)" ]]; then
            git config user.name "pnard-bot"
            git config user.email "bot@users.noreply.github.com"
            git add seen.json
            git commit -m "update seen.json [skip ci]"
            git push
          else
            echo "seen.json unchanged — nothing to commit"
          fi
